# Bilingual advice content pack. Every entry below is a draft awaiting
# review by Universitas Hasanuddin faculty: see docs/reviewing-the-copy.md
# for how to check and correct this wording. Wording, icon keys and colour
# semantics are all unreviewed placeholders, not final farmer-facing text.
# The pooled 64.5 per cent salinity yield-loss figure from the meta-analysis
# (docs/references.md, source 1) must never appear here: it is a pooled
# experimental mean, not a typical field loss.
#
# The "when" line on each entry states the condition that triggers that
# message, in plain terms, so an agronomist can check whether the advice fits
# the condition, not only the wording. The program does not read the "when"
# line; it is documentation only, and the real triggering logic lives in
# data/rules/default.yaml. The salinity class and the water-table depth used
# below are DERIVED from the probe's bulk conductivity and moisture through the
# provisional calibration in data/calibration/default.yaml, so the conductivity
# and moisture figures quoted here are illustrative placeholders. Note that
# bulk conductivity is not the same physical quantity as the saturated paste
# extract conductivity used in the published salinity thresholds. Both the
# wording and these breakpoints are open for review.

salinity_none:
  icon: salinity
  headline_id: "Salinitas tanah rendah"
  body_id: "Kondisi salinitas belum menjadi risiko saat ini."
  subtitle_en: "Salinity is low, not currently a risk"
  when: "Conductivity at or below 1000 uS/cm (non-saline class)."
  draft: true

salinity_mild:
  icon: salinity
  headline_id: "Salinitas mulai meningkat"
  body_id: "Pantau kondisi tanah dan kurangi sumber air asin bila memungkinkan."
  subtitle_en: "Salinity is mild, monitor and reduce saline water sources where possible"
  when: "Conductivity 1001 to 2000 uS/cm (slightly saline), outside the panicle initiation and flowering stages."
  draft: true

salinity_moderate:
  icon: salinity
  headline_id: "Salinitas tanah sedang"
  body_id: "Pertimbangkan pencucian lahan dengan air tawar sebelum fase generatif."
  subtitle_en: "Salinity is moderate, consider flushing the field with fresh water before the reproductive stage"
  when: "Conductivity 2001 to 4000 uS/cm (moderately saline), outside the panicle initiation and flowering stages."
  draft: true

salinity_reproductive:
  icon: salinity
  headline_id: "Salinitas berisiko tinggi pada fase ini"
  body_id: "Padi lebih peka terhadap garam pada fase inisiasi malai dan pembungaan. Segera kurangi salinitas air."
  subtitle_en: "Salinity risk is elevated: rice is more sensitive to salt from panicle initiation through flowering than at earlier stages"
  when: "Conductivity 1001 to 4000 uS/cm (slightly or moderately saline) AND the growth stage is panicle initiation or flowering. This escalates the same salinity reading to act-now during the reproductive stage."
  draft: true

salinity_severe:
  icon: salinity
  headline_id: "Salinitas tanah tinggi"
  body_id: "Segera kurangi salinitas air dan pertimbangkan pencucian lahan."
  subtitle_en: "Salinity is high, reduce saline water and consider flushing the field promptly"
  when: "Conductivity above 4000 uS/cm (severely saline), at any growth stage."
  draft: true

water_flowering_suspended:
  icon: water
  headline_id: "Jaga sawah tetap tergenang"
  body_id: "Pada fase inisiasi malai dan pembungaan, tunda pengeringan berkala dan pertahankan genangan."
  subtitle_en: "Keep the field flooded through panicle initiation and flowering, safe alternate wetting and drying is suspended during this window"
  when: "The growth stage is panicle initiation or flowering. This overrides every other water rule: keep the field flooded regardless of the water-table reading."
  draft: true

water_reflood_now:
  icon: water
  headline_id: "Saatnya mengairi kembali"
  body_id: "Muka air di bawah permukaan sudah turun sekitar 15 cm, alirkan air hingga sekitar 5 cm di atas permukaan."
  subtitle_en: "The perched water table has dropped to about 15 cm below the surface, re-flood to about 5 cm"
  when: "Estimated water table 15 cm or more below the surface (moisture at or below about 25 per cent), and not during the panicle initiation or flowering stages."
  draft: true

water_within_range:
  icon: water
  headline_id: "Pengeringan berkala berjalan aman"
  body_id: "Muka air masih dalam rentang aman, belum perlu mengairi kembali."
  subtitle_en: "The water table is still within the safe alternate wetting and drying range, no need to re-flood yet"
  when: "Estimated water table less than 15 cm below the surface (moisture above about 25 per cent), and not during the panicle initiation or flowering stages."
  draft: true

acidity_low_ph:
  icon: acidity
  headline_id: "Tanah bersifat asam"
  body_id: "Tambahkan kapur atau dolomit. Pupuk fosfor dan kalium akan lebih efektif pada tanah ini."
  subtitle_en: "Soil pH is below 5.5, apply lime or dolomite; phosphorus and potassium will repay application more strongly on this soil"
  when: "Soil pH below 5.5."
  draft: true

acidity_ok:
  icon: acidity
  headline_id: "pH tanah dalam rentang baik"
  body_id: "Tidak ada tindakan perbaikan keasaman yang diperlukan saat ini."
  subtitle_en: "Soil pH is adequate, no lime or dolomite action needed at this reading"
  when: "Soil pH 5.5 or above."
  draft: true

nutrients_weak:
  icon: nutrient
  headline_id: "Kekuatan larutan tanah lemah"
  body_id: "Nilai ini dihitung dari konduktivitas tanah, bukan dosis pupuk. Gunakan hasil uji PUTS untuk rekomendasi pupuk."
  subtitle_en: "Soil solution strength is weak, derived from conductivity alone; use a PUTS test for a fertiliser recommendation"
  when: "Conductivity at or below 1000 uS/cm (weak soil solution). Always shown as information only, never as a dose."
  draft: true

nutrients_moderate:
  icon: nutrient
  headline_id: "Kekuatan larutan tanah sedang"
  body_id: "Nilai ini dihitung dari konduktivitas tanah, bukan dosis pupuk. Gunakan hasil uji PUTS untuk rekomendasi pupuk."
  subtitle_en: "Soil solution strength is moderate, derived from conductivity alone; use a PUTS test for a fertiliser recommendation"
  when: "Conductivity 1001 to 4000 uS/cm (moderate soil solution). Always shown as information only, never as a dose."
  draft: true

nutrients_strong:
  icon: nutrient
  headline_id: "Kekuatan larutan tanah kuat"
  body_id: "Nilai ini dihitung dari konduktivitas tanah, bukan dosis pupuk. Gunakan hasil uji PUTS untuk rekomendasi pupuk."
  subtitle_en: "Soil solution strength is strong, derived from conductivity alone; use a PUTS test for a fertiliser recommendation"
  when: "Conductivity above 4000 uS/cm (strong soil solution). Always shown as information only, never as a dose."
  draft: true

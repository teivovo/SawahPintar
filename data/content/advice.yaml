# =============================================================================
# SawahPintar - bilingual advice content pack (DRAFT, awaiting review)
# =============================================================================
#
# Every entry below is a DRAFT awaiting review by Universitas Hasanuddin.
# The full guide is docs/reviewing-the-copy.md. Two kinds of reviewer use this
# file:
#   - LANGUAGE reviewer : checks and improves the Bahasa Indonesia - the
#                         headline_id and body_id lines, and the action_id
#                         wording in the npk_estimate block near the bottom.
#   - AGRONOMY reviewer : checks that each message's advice actually fits its
#                         "when" condition, and that the npk_estimate bands are
#                         sensible for local lowland rice.
#
# HOW TO READ ONE ENTRY - each advice message has six lines:
#   icon        : which pictogram shows. Chosen separately - do NOT edit.
#   headline_id : (a) the Bahasa Indonesia headline the farmer sees. REVIEW.
#   body_id     : (a) the Bahasa Indonesia sentence underneath it.   REVIEW.
#   subtitle_en : (b) the English meaning, for reference only. It tells you
#                     what the message is meant to say, so you can judge the
#                     Bahasa. It is not shown to farmers by default.
#   when        : (c) the exact condition that makes this message appear.
#   draft: true : not yet reviewed. Delete this one line once the entry is done.
#
# The "when" line is DOCUMENTATION ONLY - the app never reads it. The real
# triggering logic lives in data/rules/default.yaml. The salinity class and the
# water-table depth quoted below are DERIVED from the probe's bulk conductivity
# and moisture through data/calibration/default.yaml (marked provisional), so
# the numbers in the "when" lines are illustrative breakpoints, open for review.
# Note that bulk conductivity is not the same physical quantity as the
# saturated-paste-extract conductivity used in the published salinity
# thresholds. Both the wording and these breakpoints are open for review.
#
# RULES (see docs/reviewing-the-copy.md for detail):
#   - Keep it ASCII: straight quotes, plain hyphens, no curly quotes, no symbols.
#     A word processor such as Word can turn " into a curly quote and break the
#     file. Use a plain-text editor or the GitHub web editor.
#   - Keep the YAML valid: 2-space indentation, values in straight double quotes.
#   - Do NOT rename the key at the top of an entry (for example salinity_moderate)
#     - the app looks entries up by that key. Do NOT change the icon line.
#   - HARD RULE: never put the pooled 64.5 per cent salinity yield-loss figure
#     (docs/references.md, source 1) into farmer-facing text. It is a pooled
#     experimental mean, not a typical field loss.
# =============================================================================

# -----------------------------------------------------------------------------
# SALINITY - the highest-priority alert, escalated at panicle initiation and
# flowering (references.md, source 1). The salinity class is derived from the
# probe's bulk conductivity.
# -----------------------------------------------------------------------------

salinity_none:
  icon: salinity
  headline_id: "Salinitas tanah rendah"
  body_id: "Kondisi salinitas belum menjadi risiko saat ini."
  subtitle_en: "Salinity is low, not currently a risk"
  when: "Conductivity at or below 1000 uS/cm (non-saline class), at any growth stage."
  draft: true

salinity_mild:
  icon: salinity
  headline_id: "Salinitas mulai meningkat"
  body_id: "Pantau kondisi tanah dan kurangi sumber air asin bila memungkinkan."
  subtitle_en: "Salinity is mild, monitor and reduce saline water sources where possible"
  when: "Conductivity 1001 to 2000 uS/cm (slightly saline), outside the panicle initiation and flowering stages."
  draft: true

salinity_moderate:
  icon: salinity
  headline_id: "Salinitas tanah sedang"
  body_id: "Pertimbangkan pencucian lahan dengan air tawar sebelum fase generatif."
  subtitle_en: "Salinity is moderate, consider flushing the field with fresh water before the reproductive stage"
  when: "Conductivity 2001 to 4000 uS/cm (moderately saline), outside the panicle initiation and flowering stages."
  draft: true

salinity_reproductive:
  icon: salinity
  headline_id: "Salinitas berisiko tinggi pada fase ini"
  body_id: "Padi lebih peka terhadap garam pada fase inisiasi malai dan pembungaan. Segera kurangi salinitas air."
  subtitle_en: "Salinity risk is elevated: rice is more sensitive to salt from panicle initiation through flowering than at earlier stages"
  when: "Conductivity 1001 to 4000 uS/cm (slightly or moderately saline) AND the growth stage is panicle initiation or flowering. This escalates the same salinity reading to act-now during the reproductive stage."
  draft: true

salinity_severe:
  icon: salinity
  headline_id: "Salinitas tanah tinggi"
  body_id: "Segera kurangi salinitas air dan pertimbangkan pencucian lahan."
  subtitle_en: "Salinity is high, reduce saline water and consider flushing the field promptly"
  when: "Conductivity above 4000 uS/cm (severely saline), at any growth stage."
  draft: true

# -----------------------------------------------------------------------------
# WATER - Safe Alternate Wetting and Drying (AWD), suspended around flowering
# (references.md, source 3). The water-table depth is derived from the probe's
# moisture reading. The flowering rule overrides the depth-based rules.
# -----------------------------------------------------------------------------

water_flowering_suspended:
  icon: water
  headline_id: "Jaga sawah tetap tergenang"
  body_id: "Pada fase inisiasi malai dan pembungaan, tunda pengeringan berkala dan pertahankan genangan."
  subtitle_en: "Keep the field flooded through panicle initiation and flowering, safe alternate wetting and drying is suspended during this window"
  when: "The growth stage is panicle initiation or flowering. This overrides every other water rule: keep the field flooded regardless of the water-table reading."
  draft: true

water_reflood_now:
  icon: water
  headline_id: "Saatnya mengairi kembali"
  body_id: "Muka air di bawah permukaan sudah turun sekitar 15 cm, alirkan air hingga sekitar 5 cm di atas permukaan."
  subtitle_en: "The perched water table has dropped to about 15 cm below the surface, re-flood to about 5 cm"
  when: "Estimated water table 15 cm or more below the surface (moisture at or below about 25 per cent), and NOT during the panicle initiation or flowering stages."
  draft: true

water_within_range:
  icon: water
  headline_id: "Pengeringan berkala berjalan aman"
  body_id: "Muka air masih dalam rentang aman, belum perlu mengairi kembali."
  subtitle_en: "The water table is still within the safe alternate wetting and drying range, no need to re-flood yet"
  when: "Estimated water table less than 15 cm below the surface (moisture above about 25 per cent), and NOT during the panicle initiation or flowering stages."
  draft: true

# -----------------------------------------------------------------------------
# ACIDITY - lime or dolomite, and stronger phosphorus and potassium advice,
# below pH 5.5 (references.md, source 2).
# -----------------------------------------------------------------------------

acidity_low_ph:
  icon: acidity
  headline_id: "Tanah bersifat asam"
  body_id: "Tambahkan kapur atau dolomit. Pupuk fosfor dan kalium akan lebih efektif pada tanah ini."
  subtitle_en: "Soil pH is below 5.5, apply lime or dolomite; phosphorus and potassium will repay application more strongly on this soil"
  when: "Soil pH below 5.5."
  draft: true

acidity_ok:
  icon: acidity
  headline_id: "pH tanah dalam rentang baik"
  body_id: "Tidak ada tindakan perbaikan keasaman yang diperlukan saat ini."
  subtitle_en: "Soil pH is adequate, no lime or dolomite action needed at this reading"
  when: "Soil pH 5.5 or above."
  draft: true

# -----------------------------------------------------------------------------
# NUTRIENTS (soil-solution strength) - INFORMATION ONLY. This is derived from
# conductivity alone and is never a fertiliser dose (references.md, sources
# 6, 7 and 8). A real dose comes only from a PUTS soil-test kit read against
# Permentan 13/2022. See also the npk_estimate block below.
# -----------------------------------------------------------------------------

nutrients_weak:
  icon: nutrient
  headline_id: "Kekuatan larutan tanah lemah"
  body_id: "Nilai ini dihitung dari konduktivitas tanah, bukan dosis pupuk. Gunakan hasil uji PUTS untuk rekomendasi pupuk."
  subtitle_en: "Soil solution strength is weak, derived from conductivity alone; use a PUTS test for a fertiliser recommendation"
  when: "Conductivity at or below 1000 uS/cm (weak soil solution). Always shown as information only, never as a dose."
  draft: true

nutrients_moderate:
  icon: nutrient
  headline_id: "Kekuatan larutan tanah sedang"
  body_id: "Nilai ini dihitung dari konduktivitas tanah, bukan dosis pupuk. Gunakan hasil uji PUTS untuk rekomendasi pupuk."
  subtitle_en: "Soil solution strength is moderate, derived from conductivity alone; use a PUTS test for a fertiliser recommendation"
  when: "Conductivity 1001 to 4000 uS/cm (moderate soil solution). Always shown as information only, never as a dose."
  draft: true

nutrients_strong:
  icon: nutrient
  headline_id: "Kekuatan larutan tanah kuat"
  body_id: "Nilai ini dihitung dari konduktivitas tanah, bukan dosis pupuk. Gunakan hasil uji PUTS untuk rekomendasi pupuk."
  subtitle_en: "Soil solution strength is strong, derived from conductivity alone; use a PUTS test for a fertiliser recommendation"
  when: "Conductivity above 4000 uS/cm (strong soil solution). Always shown as information only, never as a dose."
  draft: true

# =============================================================================
# NPK ESTIMATE - the "estimasi sensor" shown on each plot's detail panel
# =============================================================================
# The app's field map shows this NPK estimate on the detail panel for each plot.
# For each nutrient the probe reports a number in mg/kg; the app sorts that
# number into one of three bands (Rendah / Sedang / Cukup) and shows a light
# suggested action beside it.
#
# THIS IS AN ESTIMATE, NEVER A FERTILISER DOSE. The probe derives N, P and K
# from a single conductivity measurement (references.md, source 8), so these are
# not independent nutrient measurements. A real fertiliser dose comes only from
# a PUTS soil-test kit read against Permentan 13/2022 (references.md, sources 6
# and 7). The action words below are gentle prompts ("pertimbangkan urea" =
# consider urea, "pantau" = monitor, "cukup" = adequate), not quantities.
#
# IMPORTANT - MIRROR IN THE APP. These thresholds and action words ALSO live in
# the application code at app/web/app.js (the NPK_META array and BAND_ID_LABEL).
# The app does NOT read them from this file. So any change a reviewer makes here
# must be passed to the developer to mirror in app.js, or the two copies drift
# apart and the screen will disagree with this file.
#
# How the bands work (matches the app boundaries):
#   - "below X"        = Rendah (low)      -> the low action
#   - "X up to Y"      = Sedang (medium)   -> "pantau" (monitor)
#   - "Y and above"    = Cukup (adequate)  -> "cukup" (adequate, no action)
# The value Y itself falls in the Cukup band.
#
# LANGUAGE reviewer: check and improve the action_id wording (Bahasa Indonesia).
# AGRONOMY reviewer: check the mg/kg ranges are sensible for local lowland rice.
# Each band carries its own draft: true - delete it once that band is reviewed.

npk_estimate:

  nitrogen:
    symbol: "N"
    label_id: "Nitrogen"
    unit: "mg/kg"
    low:
      range: "below 80 mg/kg"
      band_id: "Rendah"
      action_id: "pertimbangkan urea"
      action_en: "consider urea (a nitrogen fertiliser)"
      draft: true
    medium:
      range: "80 up to 200 mg/kg"
      band_id: "Sedang"
      action_id: "pantau"
      action_en: "monitor"
      draft: true
    adequate:
      range: "200 mg/kg and above"
      band_id: "Cukup"
      action_id: "cukup"
      action_en: "adequate, no action needed"
      draft: true

  phosphorus:
    symbol: "P"
    label_id: "Fosfor"
    unit: "mg/kg"
    low:
      range: "below 12 mg/kg"
      band_id: "Rendah"
      action_id: "pertimbangkan SP-36"
      action_en: "consider SP-36 (a phosphorus fertiliser)"
      draft: true
    medium:
      range: "12 up to 25 mg/kg"
      band_id: "Sedang"
      action_id: "pantau"
      action_en: "monitor"
      draft: true
    adequate:
      range: "25 mg/kg and above"
      band_id: "Cukup"
      action_id: "cukup"
      action_en: "adequate, no action needed"
      draft: true

  potassium:
    symbol: "K"
    label_id: "Kalium"
    unit: "mg/kg"
    low:
      range: "below 50 mg/kg"
      band_id: "Rendah"
      action_id: "pertimbangkan KCl"
      action_en: "consider KCl / muriate of potash (a potassium fertiliser)"
      draft: true
    medium:
      range: "50 up to 100 mg/kg"
      band_id: "Sedang"
      action_id: "pantau"
      action_en: "monitor"
      draft: true
    adequate:
      range: "100 mg/kg and above"
      band_id: "Cukup"
      action_id: "cukup"
      action_en: "adequate, no action needed"
      draft: true

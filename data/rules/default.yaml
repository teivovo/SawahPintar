# The four real rule groups, design spec section 8.1. Every threshold here
# is transcribed from the design spec's evidence base, not invented: see
# the comment above each group for its source.

rules:
  # Salinity, design spec section 4.1 and 8.1. A meta-analysis of 58
  # studies found the reproductive stage, panicle initiation through
  # flowering, more sensitive to salt than the seedling stage, so the
  # same salinity class is escalated one severity level during those two
  # stages. The pooled 64.5 per cent yield loss figure itself is never
  # quoted to farmers; content.yaml explains the consequence in plain
  # terms instead.
  - id: salinity_none
    group: salinity
    severity: good
    content_key: salinity_none
    condition: {source: derived, name: salinity_class, op: eq, value: non_saline}

  - id: salinity_mild
    group: salinity
    severity: attention
    content_key: salinity_mild
    condition: {source: derived, name: salinity_class, op: eq, value: slightly_saline}

  - id: salinity_mild_reproductive
    group: salinity
    severity: act_now
    content_key: salinity_reproductive
    condition: {source: derived, name: salinity_class, op: eq, value: slightly_saline}
    stages: [panicle_initiation, flowering]

  - id: salinity_moderate
    group: salinity
    severity: attention
    content_key: salinity_moderate
    condition: {source: derived, name: salinity_class, op: eq, value: moderately_saline}

  - id: salinity_moderate_reproductive
    group: salinity
    severity: act_now
    content_key: salinity_reproductive
    condition: {source: derived, name: salinity_class, op: eq, value: moderately_saline}
    stages: [panicle_initiation, flowering]

  - id: salinity_severe
    group: salinity
    severity: act_now
    content_key: salinity_severe
    condition: {source: derived, name: salinity_class, op: eq, value: severely_saline}

  # Water, IRRI Safe Alternate Wetting and Drying, design spec section 4.1
  # and 8.1. Re-flood at a water table 15 cm below the surface, top up to
  # about 5 cm. The flowering suspension is absolute: selecting panicle
  # initiation or flowering suppresses every other water rule outright,
  # regardless of the water table depth, because erring towards flooding
  # costs water whereas erring towards drainage costs yield.
  - id: water_flowering_suspension
    group: water
    severity: good
    content_key: water_flowering_suspended
    stages: [panicle_initiation, flowering]
    override: true

  - id: water_reflood_now
    group: water
    severity: act_now
    content_key: water_reflood_now
    condition: {source: derived, name: water_table_depth_cm, op: ge, value: 15}

  - id: water_within_range
    group: water
    severity: good
    content_key: water_within_range
    condition: {source: derived, name: water_table_depth_cm, op: lt, value: 15}

  # Acidity, design spec section 4.1 and 8.1, from 528 on-farm lowland
  # rice trials in Indonesia. Below pH 5.5 the yield response to added
  # phosphorus and potassium rises, so lime or dolomite and P and K
  # supplementation are worthwhile.
  - id: acidity_low_ph
    group: acidity
    severity: attention
    content_key: acidity_low_ph
    condition: {source: metric, name: ph, op: lt, value: 5.5}

  - id: acidity_ok
    group: acidity
    severity: good
    content_key: acidity_ok
    condition: {source: metric, name: ph, op: ge, value: 5.5}

  # Nutrients, design spec section 8.4. The probe's nitrogen, phosphorus
  # and potassium registers are three functions of one conductivity
  # measurement and must never be shown separately or used to derive a
  # dose. This group reports exactly one derived indicator, soil solution
  # strength, banded from the same salinity classification used above,
  # and it is always severity good because it is comparative information,
  # not an instruction: a dose comes only from the Permentan table in
  # Task 6, driven by an operator-entered PUTS result, never from here.
  - id: nutrients_weak
    group: nutrients
    severity: good
    content_key: nutrients_weak
    condition: {source: derived, name: salinity_class, op: eq, value: non_saline}

  - id: nutrients_moderate
    group: nutrients
    severity: good
    content_key: nutrients_moderate
    condition: {source: derived, name: salinity_class, op: in, value: [slightly_saline, moderately_saline]}

  - id: nutrients_strong
    group: nutrients
    severity: good
    content_key: nutrients_strong
    condition: {source: derived, name: salinity_class, op: eq, value: severely_saline}

<!doctype html>
<html lang="id" id="html-root">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SawahPintar</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="watermark" class="watermark" hidden aria-hidden="true">SIMULASI</div>
  <div id="reconnect-banner" class="reconnect-banner" hidden role="status">Sambungan terputus. Mencoba menyambung ulang...</div>

  <button id="operator-link" class="operator-link" type="button" aria-label="Konsol operator (pengaturan)" title="Konsol operator">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path fill="currentColor" d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm7.43-2.53c.04-.32.07-.64.07-.97s-.03-.65-.07-.97l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.69-.98l-.38-2.65a.49.49 0 0 0-.49-.42h-4a.49.49 0 0 0-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.5.5 0 0 0 .12.64l2.11 1.65c-.04.32-.07.64-.07.97s.03.65.07.97l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46a.5.5 0 0 0 .61.22l2.49-1c.52.39 1.08.73 1.69.98l.38 2.65a.49.49 0 0 0 .49.42h4a.49.49 0 0 0 .49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1a.5.5 0 0 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64Z"></path>
    </svg>
  </button>

  <main id="main">
    <div id="panels" class="panels"></div>
    <div id="comparison-strip" class="comparison-strip" hidden></div>
  </main>

  <template id="panel-template">
    <section class="panel">
      <header class="status-bar status-green" data-role="status-bar">
        <svg class="status-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="11"></circle>
          <path d="M7 12.5 L10.5 16 L17 8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <span class="status-label" data-role="status-label">Menunggu bacaan pertama</span>
      </header>

      <section class="advice-cards" data-role="advice-cards"></section>

      <section class="dials" data-role="dials">
        <div class="dial" data-metric="moisture">
          <svg class="dial-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2 C12 2 5 11 5 15.5 C5 19.6 8.1 22 12 22 C15.9 22 19 19.6 19 15.5 C19 11 12 2 12 2 Z"></path>
          </svg>
          <div class="dial-value"><span data-role="value">--</span><span class="dial-unit">%</span></div>
          <div class="dial-label">Kelembapan</div>
        </div>
        <div class="dial" data-metric="ph">
          <svg class="dial-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 2 h6 v5 l4 9 a3 3 0 0 1 -3 4 H8 a3 3 0 0 1 -3 -4 l4 -9 Z"></path>
            <line x1="9" y1="2" x2="9" y2="7"></line>
            <line x1="15" y1="2" x2="15" y2="7"></line>
          </svg>
          <div class="dial-value"><span data-role="value">--</span></div>
          <div class="dial-label">pH tanah</div>
        </div>
        <div class="dial" data-metric="conductivity">
          <svg class="dial-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M13 2 L4 14 h6 l-1 8 L20 10 h-6 Z"></path>
          </svg>
          <div class="dial-value"><span data-role="value">--</span><span class="dial-unit">uS/cm</span></div>
          <div class="dial-label">Kekuatan larutan tanah</div>
        </div>
        <div class="dial" data-metric="temperature">
          <svg class="dial-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="10" y="2" width="4" height="13" rx="2"></rect>
            <circle cx="12" cy="18" r="4"></circle>
          </svg>
          <div class="dial-value"><span data-role="value">--</span><span class="dial-unit">C</span></div>
          <div class="dial-label">Suhu tanah</div>
        </div>
      </section>

      <section class="trends collapsed" data-role="trends">
        <button class="trends-toggle" type="button" data-role="trends-toggle" aria-expanded="false">Tren</button>
        <div class="trends-content" data-role="trends-content" hidden>
          <div class="trend-chart" data-metric="moisture"><canvas width="480" height="120"></canvas><p class="trend-title">Kelembapan</p></div>
          <div class="trend-chart" data-metric="ph"><canvas width="480" height="120"></canvas><p class="trend-title">pH tanah</p></div>
          <div class="trend-chart" data-metric="conductivity"><canvas width="480" height="120"></canvas><p class="trend-title">Kekuatan larutan tanah</p></div>
          <div class="trend-chart" data-metric="temperature"><canvas width="480" height="120"></canvas><p class="trend-title">Suhu tanah</p></div>
        </div>
      </section>
    </section>
  </template>

  <div id="probe-overlay" class="probe-overlay" hidden>
    <div class="probe-overlay-inner">
      <div class="spinner" aria-hidden="true"></div>
      <p>Sedang membaca tanah</p>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
